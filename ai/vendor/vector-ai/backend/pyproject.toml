[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-ai-backend"
version = "0.1.0"
description = "Offline Python application core and local API for VECTOR AI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]
workflow = ["langgraph>=1.0,<2"]
vector = ["qdrant-client>=1.15,<2"]
embedding = ["sentence-transformers>=3.3,<6"]
math = ["sympy>=1.13,<2"]
documents = ["pypdf>=5,<7", "PyMuPDF>=1.25,<2"]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[project.scripts]
vector-ai-backend = "vector_ai_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_ai_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
